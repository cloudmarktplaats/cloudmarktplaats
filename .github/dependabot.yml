# Beveiligingsupdates komen hier binnen als pull request, in plaats van te
# wachten tot iemand een rode CI-run opmerkt.
#
# Aanleiding: `composer audit` faalde vanaf 6 augustus 2026 op twaalf adviezen
# in guzzle en commonmark. De poort in CI deed precies wat hij moest doen — hij
# stond rood — maar niemand keek, en dat duurde ruim twee weken. Een gate die
# alleen op een tabblad staat is geen gate. Dit is dezelfde les als bij de
# meldingen: het signaal moet naar de plek waar iemand komt.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Eén PR voor de gewone bijwerkbeurt, zodat de wekelijkse ruis één review is
    # in plaats van tien.
    groups:
      composer-minor-en-patch:
        update-types: [minor, patch]
    ignore:
      # Géén major-PR's. Bij het aanzetten opende Dependabot er meteen negen,
      # waarvan drie meteen rood (vite 6→8, intervention/image 1→4,
      # laravel-vite-plugin 1→3). Eén onbetaalde maintainer gaat die niet
      # wekelijks wegwerken, en een stapel ongelezen PR's is exact hetzelfde
      # gat als de rode CI-run die twee weken bleef staan: ruis waar een
      # signaal hoort.
      #
      # Majors doe je bewust, één voor één, wanneer je er tijd voor maakt.
      # Het vangnet voor beveiliging is niet dit bestand maar `composer audit`
      # — die faalt op élk advies, ook als de fix een major vraagt, en staat
      # sinds 22-08 ook in de dagelijkse mail.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-en-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # De workflows zelf verouderen ook: de CI-run waarschuwt al dat
  # actions/checkout@v4 op Node 20 draait en geforceerd naar 24 gaat.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
